name: khayr_ummah_app
description: تطبيق جمعية خير أمة لمتابعة الحلقات القرآنية والتسميع والحضور (أندرويد وآيفون)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # لتفعيل خط قمرة الرسمي داخل التطبيق:
  # ضع ملفات الخط في assets/fonts/ وأزل علامة # من الأسطر التالية:
  # fonts:
  #   - family: Qomra
  #     fonts:
  #       - asset: assets/fonts/Qomra-Regular.ttf
  #       - asset: assets/fonts/Qomra-Bold.ttf
  #         weight: 700
