name: Build Khayr Ummah Native Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate native project files
        run: |
          flutter create . --org com.khayrummah --project-name khayr_ummah_app --platforms=android,ios
          sed -i 's/android:label="[^"]*"/android:label="خير أمة"/' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies & generate app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: khayr-ummah-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate native project files
        run: |
          flutter create . --org com.khayrummah --project-name khayr_ummah_app --platforms=android,ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName خير أمة" ios/Runner/Info.plist || true

      - name: Install dependencies & generate app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r khayr-ummah-ios-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: khayr-ummah-ios-ipa
          path: khayr-ummah-ios-unsigned.ipa
