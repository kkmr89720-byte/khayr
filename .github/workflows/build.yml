name: Build Khayr Ummah Native Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate native project files
        run: |
          flutter create . --org com.khayrummah --project-name khayr_ummah_app --platforms=android,ios
          sed -i 's/android:label="[^"]*"/android:label="خير أمة"/' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies & generate app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build & Sign Android Release APK
        run: |
          flutter build apk --release
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          keytool -genkey -v -keystore khayr.jks -keyalg RSA -keysize 2048 -validity 10000 -alias khayr -storepass khayr123456 -keypass khayr123456 -dname "CN=KhayrUmmah, OU=App, O=KhayrUmmah, L=Damascus, ST=Damascus, C=SY"
          "$BUILD_TOOLS/zipalign" -f 4 build/app/outputs/flutter-apk/app-release.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks khayr.jks --ks-key-alias khayr --ks-pass pass:khayr123456 --key-pass pass:khayr123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out khayr-ummah-signed.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" verify khayr-ummah-signed.apk

      - name: Upload Signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: khayr-ummah-android-apk
          path: khayr-ummah-signed.apk

  build-ios:
    name: Build iOS App (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate native project files
        run: |
          flutter create . --org com.khayrummah --project-name khayr_ummah_app --platforms=android,ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName خير أمة" ios/Runner/Info.plist || true

      - name: Install dependencies & generate app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r khayr-ummah-ios-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: khayr-ummah-ios-ipa
          path: khayr-ummah-ios-unsigned.ipa
